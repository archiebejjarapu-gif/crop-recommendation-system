<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Crop Recommendation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #f5fbe9);
            color: #243b2a;
        }

        header {
            background: #216b3a;
            color: white;
            text-align: center;
            padding: 28px 15px;
        }

        header h1 {
            margin: 0 0 10px;
        }

        header p {
            margin: 0;
        }

        .container {
            max-width: 750px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 20px #00000012;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #b8cdbb;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            background: #287b43;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #195d30;
        }

        .result {
            margin-top: 22px;
            padding: 18px;
            background: #e8f5e9;
            border-radius: 10px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #526655;
        }

        @media (max-width: 520px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>🌱 Smart Crop Recommendation</h1>
        <p>Find a suitable crop based on soil and weather data</p>
    </header>

    <main class="container">
        <h2>Enter Soil & Weather Details</h2>

        <form action="/predict" method="POST">
            <div class="grid">
                <div>
                    <label for="N">Nitrogen (N)</label>
                    <input type="number" id="N" name="N"
                           step="any" min="0" required>
                </div>

                <div>
                    <label for="P">Phosphorus (P)</label>
                    <input type="number" id="P" name="P"
                           step="any" min="0" required>
                </div>

                <div>
                    <label for="K">Potassium (K)</label>
                    <input type="number" id="K" name="K"
                           step="any" min="0" required>
                </div>

                <div>
                    <label for="temperature">Temperature (°C)</label>
                    <input type="number" id="temperature"
                           name="temperature" step="any" required>
                </div>

                <div>
                    <label for="humidity">Humidity (%)</label>
                    <input type="number" id="humidity"
                           name="humidity" min="0" max="100"
                           step="any" required>
                </div>

                <div>
                    <label for="ph">Soil pH</label>
                    <input type="number" id="ph" name="ph"
                           min="0" max="14" step="any" required>
                </div>

                <div>
                    <label for="rainfall">Rainfall (mm)</label>
                    <input type="number" id="rainfall"
                           name="rainfall" min="0"
                           step="any" required>
                </div>
            </div>

            <button type="submit">🌾 Recommend Crop</button>
        </form>

        {% if prediction %}
        <div class="result">
            <h2>🌿 Recommendation Result</h2>
            <p>Suggested crop: <strong>{{ prediction }}</strong></p>
        </div>
        {% endif %}
    </main>

    <footer>
        Smart Crop Recommendation System
    </footer>
</body>
</html>
